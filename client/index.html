<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6b63" />
    <meta name="description" content="خيرات Foods — إدارة المبيعات والمخزون والعملاء ببساطة" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/site-icon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>خيرات Foods | إدارة الأعمال</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const analyticsEndpoint = "%VITE_ANALYTICS_ENDPOINT%";
      const analyticsWebsiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
      if (analyticsEndpoint && analyticsEndpoint !== "%VITE_ANALYTICS_ENDPOINT%" && analyticsWebsiteId && analyticsWebsiteId !== "%VITE_ANALYTICS_WEBSITE_ID%") {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${analyticsEndpoint}/umami`;
        script.dataset.websiteId = analyticsWebsiteId;
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
